# =============================================================================
# Debian Preseed Template
# Do not edit dist/preseed.cfg directly - edit this file and re-run generate_installer.py
# =============================================================================

# Locale & Keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Mirror
d-i mirror/country string US
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string $TIMEZONE$
d-i clock-setup/ntp boolean true

# Network 
d-i netcfg/choose_interface select $NET_IFACE$
d-i netcfg/get_hostname string $HOSTNAME$
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

# Partitioning
d-i partman-auto/disk string $INSTALL_DISK$
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Users & Passwords
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $ROOT_HASH$
d-i passwd/user-fullname string $USER_FULLNAME$
d-i passwd/username string $USER_NAME$
d-i passwd/user-password-crypted password $USER_HASH$
d-i passwd/user-default-groups string sudo audio cdrom video plugdev

# Packages 
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo curl ufw fail2ban unattended-upgrades apt-listchanges openssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Suppress Reboot Confirmation Note
d-i finish-install/reboot_in_progress note

# Late Command 
# Late Command
d-i preseed/late_command string \
    echo '#!/bin/sh' > /target/tmp/finish.sh ; \
    echo 'exec > /var/log/late_command.log 2>&1' >> /target/tmp/finish.sh ; \
    echo 'export PATH=$PATH:/sbin:/usr/sbin:/usr/bin:/bin' >> /target/tmp/finish.sh ; \
    echo 'echo "export PATH=\$PATH:/sbin:/usr/sbin:/usr/bin:/bin" >> /root/.bashrc' >> /target/tmp/finish.sh ; \
    echo 'echo "export PATH=\$PATH:/sbin:/usr/sbin:/usr/bin:/bin" >> /home/$USER_NAME$/.bashrc' >> /target/tmp/finish.sh ; \
    echo 'mkdir -p /home/$USER_NAME$/.ssh' >> /target/tmp/finish.sh ; \
    echo 'echo "$PUBLIC_KEY$" >> /home/$USER_NAME$/.ssh/authorized_keys' >> /target/tmp/finish.sh ; \
    echo 'chmod 700 /home/$USER_NAME$/.ssh' >> /target/tmp/finish.sh ; \
    echo 'chmod 600 /home/$USER_NAME$/.ssh/authorized_keys' >> /target/tmp/finish.sh ; \
    echo 'chown -R $USER_NAME$:$USER_NAME$ /home/$USER_NAME$/.ssh' >> /target/tmp/finish.sh ; \
    echo 'sed -i "s/^#\?Port 22/Port $SSH_PORT$/" /etc/ssh/sshd_config' >> /target/tmp/finish.sh ; \
    echo 'sed -i "s/^#\?PasswordAuthentication yes/PasswordAuthentication no/" /etc/ssh/sshd_config' >> /target/tmp/finish.sh ; \
    echo 'sed -i "s/^#\?PermitRootLogin .*/PermitRootLogin no/" /etc/ssh/sshd_config' >> /target/tmp/finish.sh ; \
    echo 'grep -q "^PubkeyAuthentication" /etc/ssh/sshd_config || echo "PubkeyAuthentication yes" >> /etc/ssh/sshd_config' >> /target/tmp/finish.sh ; \
    echo 'ufw default deny incoming' >> /target/tmp/finish.sh ; \
    echo 'ufw default allow outgoing' >> /target/tmp/finish.sh ; \
    echo 'ufw limit $SSH_PORT$/tcp' >> /target/tmp/finish.sh ; \
    echo 'ufw allow 80/tcp' >> /target/tmp/finish.sh ; \
    echo 'ufw allow 443/tcp' >> /target/tmp/finish.sh ; \
    echo 'ufw --force enable' >> /target/tmp/finish.sh ; \
    echo 'echo "blacklist b43" > /etc/modprobe.d/blacklist-b43.conf' >> /target/tmp/finish.sh ; \
    echo 'echo "blacklist bcma" >> /etc/modprobe.d/blacklist-b43.conf' >> /target/tmp/finish.sh ; \
    echo 'update-initramfs -u' >> /target/tmp/finish.sh ; \
    echo 'cat << EOF > /etc/network/interfaces' >> /target/tmp/finish.sh ; \
    echo 'auto lo' >> /target/tmp/finish.sh ; \
    echo 'iface lo inet loopback' >> /target/tmp/finish.sh ; \
    echo '' >> /target/tmp/finish.sh ; \
    echo 'auto $NET_IFACE$' >> /target/tmp/finish.sh ; \
    echo 'iface $NET_IFACE$ inet static' >> /target/tmp/finish.sh ; \
    echo '    address $STATIC_IP$' >> /target/tmp/finish.sh ; \
    echo '    netmask $NETMASK$' >> /target/tmp/finish.sh ; \
    echo '    gateway $GATEWAY$' >> /target/tmp/finish.sh ; \
    echo '    dns-nameservers $DNS_SERVERS$' >> /target/tmp/finish.sh ; \
    echo 'EOF' >> /target/tmp/finish.sh ; \
    echo 'systemctl enable unattended-upgrades' >> /target/tmp/finish.sh ; \
    echo 'systemctl enable fail2ban' >> /target/tmp/finish.sh ; \
    in-target chmod +x /tmp/finish.sh ; \
    in-target /tmp/finish.sh ; \
    rm /target/tmp/finish.sh