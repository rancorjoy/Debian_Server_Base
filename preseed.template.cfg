# =============================================================================
# Debian Preseed Template
# Do not edit dist/preseed.cfg directly - edit this file and re-run generate_installer.py
# =============================================================================

# Locale & Keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Mirror
d-i mirror/country string US
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string $TIMEZONE$
d-i clock-setup/ntp boolean true

# Network 
d-i netcfg/choose_interface select $NET_IFACE$
d-i netcfg/get_hostname string $HOSTNAME$
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

# Partitioning
d-i partman-auto/disk string $INSTALL_DISK$
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Users & Passwords
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $ROOT_HASH$
d-i passwd/user-fullname string $USER_FULLNAME$
d-i passwd/username string $USER_NAME$
d-i passwd/user-password-crypted password $USER_HASH$
d-i passwd/user-default-groups string sudo audio cdrom video plugdev

# Packages 
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo curl ufw fail2ban unattended-upgrades apt-listchanges openssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Suppress Reboot Confirmation Note
d-i finish-install/reboot_in_progress note

# Late Command 
d-i preseed/late_command string in-target sh -c '\
    LOG=/var/log/late_command.log ; \
    exec > $LOG 2>&1 ; \
    echo "=== PATH ===" ; \
    echo '"'"'export PATH=$PATH:/sbin:/usr/sbin:/usr/bin:/bin'"'"' >> /root/.bashrc || { echo "FAILED: root bashrc"; exit 1; } ; \
    echo '"'"'export PATH=$PATH:/sbin:/usr/sbin:/usr/bin:/bin'"'"' >> /home/$USER_NAME$/.bashrc || { echo "FAILED: user bashrc"; exit 1; } ; \
    echo "=== SSH key ===" ; \
    mkdir -p /home/$USER_NAME$/.ssh || { echo "FAILED: mkdir ssh"; exit 1; } ; \
    echo "$PUBLIC_KEY$" >> /home/$USER_NAME$/.ssh/authorized_keys || { echo "FAILED: authorized_keys"; exit 1; } ; \
    chmod 700 /home/$USER_NAME$/.ssh || { echo "FAILED: chmod ssh dir"; exit 1; } ; \
    chmod 600 /home/$USER_NAME$/.ssh/authorized_keys || { echo "FAILED: chmod authorized_keys"; exit 1; } ; \
    chown -R $USER_NAME$:$USER_NAME$ /home/$USER_NAME$/.ssh || { echo "FAILED: chown ssh"; exit 1; } ; \
    echo "=== SSH hardening ===" ; \
    sed -i "s/^#Port 22/Port $SSH_PORT$/" /etc/ssh/sshd_config || { echo "FAILED: sed port uncomment"; exit 1; } ; \
    sed -i "s/^Port 22/Port $SSH_PORT$/" /etc/ssh/sshd_config || { echo "FAILED: sed port replace"; exit 1; } ; \
    sed -i "s/^#PasswordAuthentication yes/PasswordAuthentication no/" /etc/ssh/sshd_config || { echo "FAILED: sed pw auth uncomment"; exit 1; } ; \
    sed -i "s/^PasswordAuthentication yes/PasswordAuthentication no/" /etc/ssh/sshd_config || { echo "FAILED: sed pw auth"; exit 1; } ; \
    sed -i "s/^#PermitRootLogin .*/PermitRootLogin no/" /etc/ssh/sshd_config || { echo "FAILED: sed root login uncomment"; exit 1; } ; \
    sed -i "s/^PermitRootLogin .*/PermitRootLogin no/" /etc/ssh/sshd_config || { echo "FAILED: sed root login"; exit 1; } ; \
    grep -q "^PubkeyAuthentication" /etc/ssh/sshd_config || echo "PubkeyAuthentication yes" >> /etc/ssh/sshd_config ; \
    echo "=== UFW ===" ; \
    ufw default deny incoming || { echo "FAILED: ufw deny incoming"; exit 1; } ; \
    ufw default allow outgoing || { echo "FAILED: ufw allow outgoing"; exit 1; } ; \
    ufw limit $SSH_PORT$/tcp || { echo "FAILED: ufw ssh port"; exit 1; } ; \
    ufw allow 80/tcp || { echo "FAILED: ufw 80"; exit 1; } ; \
    ufw allow 443/tcp || { echo "FAILED: ufw 443"; exit 1; } ; \
    ufw --force enable || true ; \
    echo "=== Driver blacklist ===" ; \
    echo "blacklist b43" > /etc/modprobe.d/blacklist-b43.conf || { echo "FAILED: blacklist b43"; exit 1; } ; \
    echo "blacklist bcma" >> /etc/modprobe.d/blacklist-b43.conf || { echo "FAILED: blacklist bcma"; exit 1; } ; \
    update-initramfs -u || true ; \
    echo "=== Static IP ===" ; \
    printf "auto lo\niface lo inet loopback\n\nauto $NET_IFACE$\niface $NET_IFACE$ inet static\n    address $STATIC_IP$\n    netmask $NETMASK$\n    gateway $GATEWAY$\n    dns-nameservers $DNS_SERVERS$\n" > /etc/network/interfaces || { echo "FAILED: static ip"; exit 1; } ; \
    echo "=== Unattended upgrades ===" ; \
    systemctl enable unattended-upgrades || { echo "FAILED: unattended-upgrades"; exit 1; } ; \
    echo "=== fail2ban ===" ; \
    systemctl enable fail2ban || { echo "FAILED: fail2ban"; exit 1; } ; \
    echo "=== Done ===" ; \
'